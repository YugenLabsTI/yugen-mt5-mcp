[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yugen-mt5-mcp"
version = "1.1.0"
description = "Secure, auditable MCP server foundation for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [
  { name = "Yugen" },
]
keywords = ["mcp", "metatrader5", "trading", "mt5", "fastmcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastmcp>=2.10,<4.0",
  "typer>=0.12,<1.0",
  "python-dotenv>=1.0,<2.0",
  "MetaTrader5>=5.0; sys_platform=='win32'",
]

[project.urls]
Homepage = "https://github.com/YugenLabsTI/yugen-mt5-mcp"
Repository = "https://github.com/YugenLabsTI/yugen-mt5-mcp"
Issues = "https://github.com/YugenLabsTI/yugen-mt5-mcp/issues"
Changelog = "https://github.com/YugenLabsTI/yugen-mt5-mcp/blob/main/CHANGELOG.md"

[project.scripts]
yugen-mt5-mcp = "yugen_mt5_mcp.cli:main"

[project.optional-dependencies]
remote = [
  "uvicorn>=0.29,<1.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<9.0",
  "ruff>=0.5,<0.6",
  "uvicorn>=0.29,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["yugen_mt5_mcp"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option / typer.Argument as argument defaults is the idiomatic Typer
# API, not a mutable-default bug. Mark them immutable so B008 stops flagging.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "MetaTrader5"
ignore_missing_imports = true
